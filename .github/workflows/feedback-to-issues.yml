name: Feedback to issues
# Files new in-game bug reports and ideas from Firestore as GitHub issues.
on:
  schedule:
    - cron: '30 2,8,14,20 * * *'   # every 6 hours (20:30 UTC = 7:30am Sydney)
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts firebase-admin@12.7.0
      - run: node scripts/feedback-to-issues.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
