name: Firestore rules test
# Runs the Card Club security-rules tests against the Firestore emulator whenever the rules or tests change.
on:
  pull_request:
    paths: ['firestore.rules', 'tests/**', '.github/workflows/rules-test.yml']
  push:
    branches: [main]
    paths: ['firestore.rules', 'tests/**', '.github/workflows/rules-test.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --no-package-lock --ignore-scripts firebase-tools@14.27.0 @firebase/rules-unit-testing@5.0.2 firebase@12.19.0
      - run: echo '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080}}}' > firebase.json
      - run: npx firebase emulators:exec --only firestore --project demo-heartwood "node --test tests/club-rules.test.mjs"
